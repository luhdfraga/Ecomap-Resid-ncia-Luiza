    <header>
        <a href="home.html" class="logo-container">
            <div class="logo-icone">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
            </div>
            <span class="logo-texto">Eco<span>map</span></span>
        </a>

        <nav>
            <a href="home.html">Início</a>
            <a href="mapaecopontos.html">Ache um EcoPonto</a>
            <a href="agendarcoleta.html">Agendar Coleta</a>
            <a href="cadastrarecopontos.html">Cadastrar EcoPonto</a>
            <a href="loginecoponto.html" class="nav-parceiro">Área do EcoPonto</a>
            <a href="login.html" class="nav-perfil active">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icone-usuario">

                    <span>Login Cidadão</span>

        </nav>
    </header>

    <section id="cadastro-comunidade">
        <h2>Pessoa: Cadastrar</h2>
        <form style="width: 100%;">
            <div class="grupo-campo">
                <label for="nome-usuario">Nome Completo:</label>
                <input type="text" id="nome-usuario" placeholder="Digite seu nome completo">
            </div>

            <div class="grupo-campo-duplo">
                <div class="grupo-campo">
                    <label for="email-usuario">E-mail:</label>
                    <input type="email" id="email-usuario" placeholder="seuemail@exemplo.com">
                </div>
                <div class="grupo-campo">
                    <label for="senha-usuario">Senha:</label>
                    <input type="password" id="senha-usuario" placeholder="Mínimo 6 caracteres">
                </div>
            </div>

            <button type="button" class="btn-comunidade">Finalizar Cadastro de Pessoa</button>
        </form>
    </section>

    <footer>
        <h4>Entre em contato comigo!</h4>
